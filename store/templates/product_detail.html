{% load static %}

<!DOCTYPE html>
<html>
<head>

<title>{{ product.name }}</title>

<link rel="stylesheet"
      href="{% static 'style.css' %}">

</head>

<body>

<div class="container">

    <div class="card">

        <img src="{{ product.image }}">

        <h1>{{ product.name }}</h1>

        <p>{{ product.description }}</p>

        <h2>₹{{ product.price }}</h2>

        <a class="btn"
           href="/add-to-cart/{{ product.id }}/">

           Add To Cart

        </a>

        <br><br>

        <a href="/">
            Back To Store
        </a>

    </div>

</div>

</body>
</html>
