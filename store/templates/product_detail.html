{% load static %}

<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }}</title>

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

</head>

<body>

<nav>

    <a href="/">🏠 Home</a>

    <a href="/cart/">🛒 Cart</a>

    {% if user.is_authenticated %}

        <span class="username">
            👋 {{ user.username }}
        </span>

        <a href="/logout/">Logout</a>

    {% else %}

        <a href="/login/">Login</a>

        <a href="/register/">Register</a>

    {% endif %}

</nav>

<div class="container">

    <div class="product-detail">

        <div class="product-image">

            <img src="{{ product.image }}"
                 alt="{{ product.name }}">

        </div>

        <div class="product-info">

            <h1>{{ product.name }}</h1>

            <p>{{ product.description }}</p>

            <h2>₹{{ product.price }}</h2>

            <a class="btn"
               href="/add-to-cart/{{ product.id }}/">

                🛒 Add To Cart

            </a>

            <br><br>

            <a href="/">

                ← Back To Store

            </a>

        </div>

    </div>

</div>

<footer>

    © 2026 My E-Commerce Store

</footer>

</body>

</html>
