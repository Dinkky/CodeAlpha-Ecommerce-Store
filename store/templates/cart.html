{% load static %}

<!DOCTYPE html>
<html>
<head>

<title>Cart</title>

<link rel="stylesheet"
      href="{% static 'style.css' %}">

</head>

<body>

<div class="container">

<h1>Shopping Cart</h1>

{% for product in products %}

<div class="card">

    <h2>{{ product.name }}</h2>

    <h3>₹{{ product.price }}</h3>

</div>

{% endfor %}

<h2>Total: ₹{{ total }}</h2>

<a class="btn"
   href="/checkout/">

   Checkout

</a>

</div>

</body>
</html>
